name: CI/CD

# Deny all permissions by default — each job grants only what it needs
permissions: {}

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  # ── CI: lint + test + type-check on every push and PR ─────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

  # ── CD (production): deploy to Vercel only after CI passes on master ───────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          if [[ -z "$URL" || "$URL" == *$'\n'* ]]; then
            echo "Unexpected deploy output" && exit 1
          fi
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "### Production deployed to $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  # ── CD (preview): deploy PR previews so reviewers can click through ─────────
  deploy-preview:
    name: Deploy → Preview
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          if [[ -z "$URL" || "$URL" == *$'\n'* ]]; then
            echo "Unexpected deploy output" && exit 1
          fi
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      # URL passed via env: so it's treated as data, not code
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview deployed\n\n🔗 ${process.env.DEPLOY_URL}`
            })
