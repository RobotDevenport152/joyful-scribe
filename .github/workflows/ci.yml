name: CI/CD

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

      - name: Dependency vulnerability scan (production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Pull Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build against production env
        run: |
          cp .vercel/.env.production.local .env.local
          npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 8080 --host > vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server never came up:" && cat vite-preview.log && exit 1

      - name: Sanity check the pulled Supabase credentials actually work
        run: npm run ci:check-supabase-env

      - name: Run Playwright e2e suite
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test tests/e2e --config=playwright.config.ts --reporter=list,html

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check SUPABASE_ACCESS_TOKEN is configured
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret is not set - skipping this job. Generate one from the Supabase dashboard (Account -> Access Tokens) and add it as a repo secret to enable automatic Edge Function deploys."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all Edge Functions
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy --project-ref pymnquyxpoeqkkuzzial --use-api

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, e2e]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      previous_deployment_id: ${{ steps.capture_previous.outputs.id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recorded before the new deploy replaces it, so verify-production can
      # roll back to exactly this if the new deploy turns out to be broken.
      # `vercel rollback` (this CLI version) requires an explicit deployment
      # id/url — there's no bare "undo the last one" form to rely on.
      # v7/deployments + rollbackCandidate=true, not v6. Field is `uid`, NOT
      # `id` — the first version of this script got that wrong (assumed
      # from memory of a different tool's already-normalized output instead
      # of checking the raw response) and it went undetected until a real
      # run's ::warning:: annotation printed the actual payload. Confirmed
      # from that real response, not guessed a second time.
      - name: Capture current production deployment (for rollback if needed)
        id: capture_previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESPONSE=$(curl -s "https://api.vercel.com/v7/deployments?projectId=prj_h9qpJHQT6IQFkciPKDrktOS1IknA&target=production&rollbackCandidate=true&limit=1&teamId=team_F1dXYNG6H7HNPP4OB6Rm5SJD" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          ID=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);process.stdout.write(j.deployments?.[0]?.uid||'');}catch(e){}})")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ID" ]; then
            echo "::warning::Could not capture a previous production deployment id — auto-rollback won't be possible if this deploy turns out unhealthy. Raw API response: $(echo "$RESPONSE" | head -c 300)"
          else
            echo "::notice::Current (pre-deploy) production deployment recorded for possible rollback: $ID"
          fi

      - name: Pull Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          if [[ -z "$URL" || "$URL" == *$'\n'* ]]; then
            echo "Unexpected deploy output" && exit 1
          fi
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "### Production deployed to $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  # ── Post-deploy safety net: catches problems e2e can't (real Vercel/DNS/
  # Cloudflare edge behavior, exactly the class of bug that broke the new
  # crawler-metadata middleware twice this session) and auto-rolls back
  # rather than leaving a broken site live until a human notices.
  #
  # DISABLED (2026-07-17, at the user's explicit request) after its own
  # first two real runs both malfunctioned: a wrong field name meant
  # rollback silently couldn't happen, and — more concerning — a
  # Cloudflare Bot Fight Mode false-positive on the health check nearly
  # triggered a rollback of a perfectly healthy deploy. The 5-retry fix for
  # the false-positive case is in this file but UNVERIFIED against a real
  # run. Do not flip `if: false` back to enabled without watching at least
  # one real run complete successfully end to end first — the point of
  # this job is to be trustworthy enough to act on automatically; two
  # unverified fixes in a row is not that bar yet.
  verify-production:
    name: Verify Production & Auto-Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-production
    if: false
    permissions:
      contents: read

    steps:
      - name: Wait for edge propagation
        run: sleep 20

      # Retries before concluding "unhealthy": a single request isn't
      # reliable enough to trigger an automatic rollback on. This zone has
      # Cloudflare Bot Fight Mode enabled, and GitHub Actions' IP range has
      # now been blocked by it three separate times this session (the
      # uptime-check workflow twice, and this exact check once, immediately
      # confirmed as a false alarm — the live site was independently
      # verified healthy seconds later from a different network). A real
      # outage fails consistently across retries; a Cloudflare challenge
      # usually doesn't.
      - name: Health check the live site (with retries)
        id: health
        run: |
          HEALTHY=false
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              "https://pacificalpaca.com/?_health_check_attempt=$i")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && grep -q "Pacific Alpacas" /tmp/body.html; then
              HEALTHY=true
              break
            fi
            sleep 10
          done
          if [ "$HEALTHY" = "true" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::error::Post-deploy health check failed 5 times in a row (last: HTTP $HTTP_CODE) — rolling back."
            head -c 500 /tmp/body.html
          fi

      - name: Roll back to the previous production deployment
        if: steps.health.outputs.healthy != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_ID: ${{ needs.deploy-production.outputs.previous_deployment_id }}
        run: |
          if [ -z "$PREVIOUS_ID" ]; then
            echo "::error::No previous production deployment was recorded — cannot auto-rollback. Investigate and roll back manually via the Vercel dashboard."
            exit 1
          fi
          npx vercel rollback "$PREVIOUS_ID" --token="$VERCEL_TOKEN" --yes
          npx vercel rollback status --token="$VERCEL_TOKEN" || true
          echo "::error::Health check failed after deploying — automatically rolled back to $PREVIOUS_ID. The commit that triggered this needs investigation before it can ship again."
          exit 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          if [[ -z "$URL" || "$URL" == *$'\n'* ]]; then
            echo "Unexpected deploy output" && exit 1
          fi
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview deployed\n\n🔗 ${process.env.DEPLOY_URL}\n\nThe preview smoke test runs in a separate job.`
            })

  preview-smoke:
    name: Preview smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Health check preview URL
        env:
          DEPLOY_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        run: curl -fsSL "$DEPLOY_URL" > /dev/null

      - name: Run preview smoke test
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test tests/e2e/smoke.spec.ts --config=playwright.config.ts --reporter=list,html

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
