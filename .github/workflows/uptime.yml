name: Uptime check

# Scheduled synthetic checks against production. Deliberately NOT just
# "curl / and check for 200" — vercel.json rewrites every path to
# index.html, so a bare status check on /login or /checkout can't actually
# tell a broken route from a working one (the SPA shell always loads).
# These three checks instead exercise the layers that have actually broken
# in the past this session/in PROJECT_STATUS.md: DNS/CDN reachability, the
# Supabase API itself, and the exact CORS preflight that caused the
# JAVASCRIPT-REACT-7 checkout_failed incident.
#
# On failure, GitHub emails the repo's Actions-notification recipients by
# default — no Slack webhook or external service required. If you want
# Slack/SMS paging instead, that needs a webhook URL added as a repo
# secret; ask for that to be wired in once one exists.
#
# Each check retries 5x with a 10s gap before failing (2026-07-18), same
# pattern already used by ci.yml's verify-production health check. This
# zone has Cloudflare Bot Fight Mode enabled, and GitHub Actions' datacenter
# IP range (AS8075, Microsoft/Azure) gets occasionally challenged by it —
# a real outage fails consistently across retries, a Cloudflare false
# positive usually doesn't. Deliberately NOT fixed by allowlisting AS8075
# in Cloudflare: that ASN is all of Azure, not just GitHub Actions, and
# this zone's only protection on /login and /checkout (no rate limit
# exists on those paths, only /admin has one — see cloudflare.tf) is Bot
# Fight Mode. Exempting an entire top-3 public cloud from it on a
# Stripe-integrated checkout would trade a monitoring false-positive for a
# real card-testing/credential-stuffing exposure — a security posture
# change, not a monitoring fix, and not done here.

# Schedule disabled (2026-07-18), at the user's request, after every single
# scheduled run since this workflow existed failed on Cloudflare's Bot
# Fight Mode challenging GitHub Actions' IP range (AS8075/Azure) -- an
# actual interactive Turnstile "Just a moment..." page, which curl can
# never solve regardless of retries. The 5x retry fix above is committed
# but UNVERIFIED against a real run -- every failure checked so far,
# including the one that triggered this, predates that commit. Re-enable
# the schedule only after a manual workflow_dispatch run (still enabled
# below) is confirmed passing -- don't just uncomment this blind.
on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  uptime:
    name: Ping production
    runs-on: ubuntu-latest
    steps:
      # -A: a plain curl UA plus GitHub Actions' datacenter IP range is
      # exactly the traffic profile Cloudflare's Bot Fight Mode (enabled on
      # this zone, see infra/terraform/cloudflare.tf) is designed to
      # challenge. A browser UA doesn't guarantee passing Cloudflare's
      # scoring (TLS fingerprint matters too, which curl can't fake), so
      # this also retries 5x/10s before concluding the site is actually down.
      - name: Homepage reachable and serving real content
        run: |
          HEALTHY=false
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              https://pacificalpaca.com/)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && grep -q "Pacific Alpacas" /tmp/body.html; then
              HEALTHY=true
              break
            fi
            sleep 10
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Non-200 or missing content after 5 attempts (last: HTTP $HTTP_CODE) — check whether this is a real outage or Cloudflare challenging GitHub Actions' IP range (Bot Fight Mode is enabled on this zone)."
            head -c 500 /tmp/body.html
            exit 1
          fi

      - name: Supabase API reachable
        env:
          # Public anon key — safe to commit, it's already shipped in the
          # client bundle (same reasoning as the Sentry DSN elsewhere in
          # this repo: this class of key is meant to be public).
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bW5xdXl4cG9lcWtrdXp6aWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MDcyMzMsImV4cCI6MjA5MTE4MzIzM30.-q0rjRbjArN__-H6BPw9ZUHfb_BQSYBC2-fkYQSEBbc
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 15 "https://pymnquyxpoeqkkuzzial.supabase.co/rest/v1/products?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -o /dev/null; then
              exit 0
            fi
            echo "Attempt $i failed"
            sleep 10
          done
          echo "::error::Supabase API unreachable after 5 attempts"
          exit 1

      - name: Checkout CORS preflight allows the real domain
        run: |
          for i in 1 2 3 4 5; do
            ALLOW_ORIGIN=$(curl -s --max-time 15 -X OPTIONS \
              "https://pymnquyxpoeqkkuzzial.supabase.co/functions/v1/create-checkout" \
              -H "Origin: https://pacificalpaca.com" \
              -H "Access-Control-Request-Method: POST" \
              -D - -o /dev/null | grep -i "access-control-allow-origin" | tr -d '\r')
            echo "Attempt $i: $ALLOW_ORIGIN"
            if echo "$ALLOW_ORIGIN" | grep -q "https://pacificalpaca.com"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::CORS preflight didn't allow pacificalpaca.com after 5 attempts — this is exactly the JAVASCRIPT-REACT-7 class of bug"
          exit 1
